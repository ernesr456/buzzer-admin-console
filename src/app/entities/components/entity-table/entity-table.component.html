<div class="flex flex-wrap justify-between gap-3">
  <h1 class="text-2xl self-center">Main Entities</h1>
  <div class="flex gap-3 flex-wrap">
    <!-- 🔽 Search input -->
    <input
      type="text"
      placeholder="Search entities..."
      (input)="onSearch($any($event.target).value)"
      class="px-4 py-2 rounded-md bg-white/5 border border-white/10 text-white placeholder:text-white/40 focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    <button
      (click)="openAddDialog()"
      class="flex items-center border border-white/10 gap-2 px-4 py-2 font-medium rounded-md hover:opacity-90 transition w-full md:w-fit"
    >
      <span class="material-symbols-outlined">Add</span>
      Add Entity
    </button>
  </div>
</div>

<div class="overflow-x-auto">
  <table class="w-full text-sm [&_td:nth-child(even)]:bg-white/5 [&_th:nth-child(even)]:bg-white/5">
    <thead class="bg-white/10">
      <tr class="border-b border-white/5">
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Main Entities</th>
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Country</th>
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Actions</th>
      </tr>
    </thead>
    <tbody>
      @if (filteredEntities$ | async; as rows) {
        @if (rows.length > 0) {
          @for (row of rows; track row.id) {
            <tr
              (click)="navigateToDetail(row)"
              class="border-b border-white/5 last:border-0 hover:bg-white/10 transition cursor-pointer"
            >
              <td class="py-3 px-4">
                <span class="text-white font-medium">{{ row.name }}</span>
              </td>
              <td class="py-3 px-4">{{ row.country || '—' }}</td>
              <td class="py-3 px-4">
                <button
                  (click)="$event.stopPropagation(); openEditDialog(row)"
                  class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
                  aria-label="Edit"
                >
                  <span class="material-symbols-outlined text-xl">edit</span>
                </button>
                <button
                  (click)="$event.stopPropagation(); deleteEntity(row)"
                  class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
                  aria-label="Delete"
                >
                  <span class="material-symbols-outlined text-xl">delete</span>
                </button>
              </td>
            </tr>
          }
        } @else {
          <tr>
            <td colspan="5" class="py-6 text-center text-[#8b95b0]">
              <span class="material-symbols-outlined text-2xl block mb-1">inbox</span>
              No main entities found for this sport.
            </td>
          </tr>
        }
      } @else {
        <tr>
          <td colspan="5" class="py-6 text-center text-white/30">Loading entities...</td>
        </tr>
      }
    </tbody>
  </table>
</div>
