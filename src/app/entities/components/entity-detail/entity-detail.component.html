
<div class="min-h-screen flex-col space-y-3">
  <app-custom-breadcrumbs />

  <div *ngIf="!(entity$ | async)" class="flex justify-center items-center h-64">
    <div class="text-gray-400">Loading entity…</div>
  </div>

  <ng-container *ngIf="entity$ | async as entity">
    <div *ngIf="!entity" class="flex justify-center items-center h-64">
      <div class="text-gray-400">Entity not found.</div>
    </div>

    <div *ngIf="entity" class="rounded-xl border border-[#3E3E3E] shadow-sm overflow-hidden relative">
      <div *ngIf="entity" class="relative p-6 border border-white/10 rounded-lg">
        <div class="absolute top-3 right-3 p-2 space-x-2">
          <button
            (click)="openEditDialog(entity)"
            class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
            aria-label="Edit"
          >
            <span class="material-symbols-outlined text-xl">edit</span>
          </button>
          <button
            (click)="deleteEntity(entity)"
            class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
            aria-label="Delete"
          >
            <span class="material-symbols-outlined text-xl">delete</span>
          </button>
        </div>

        <h2 class="font-bold text-white headline-small !text-xl pr-10 flex items-center gap-2">
          {{ entity.name }}
        </h2>
        <span>{{entity.country}}</span>

        <div class="flex flex-wrap justify-between w-full items-center gap-x-6 gap-y-2 !text-sm text-[#8b95b0] label-large mt-3">
          <span>
            <span class="text-[#b0b8cc]">Created:</span>
            {{ entity.createdAt | date:'MMM d, y, h:mm a' }}
          </span>
          <span>
            <span class="text-[#b0b8cc]">Updated:</span>
            {{ entity.updatedAt | date:'MMM d, y, h:mm a' }}
          </span>
        </div>
      </div>

      <div class="px-5 py-5 sm:px-6">
        <app-organization-table/>
      </div>
    </div>
  </ng-container>
</div>
