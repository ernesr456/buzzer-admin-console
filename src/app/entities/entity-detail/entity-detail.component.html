<div class="min-h-screen flex-col space-y-3">
  <app-custom-breadcrumbs />

  @if (loading()) {
    <!-- Skeleton -->
    <div class="rounded-xl border border-[#3E3E3E] shadow-sm overflow-hidden relative animate-pulse">
      <div class="relative p-6 border border-white/10 rounded-lg">
        <!-- Action buttons skeleton -->
        <div class="absolute top-3 right-3 p-2 space-x-2">
          <div class="w-8 h-8 bg-[#3E3E3E] rounded-lg inline-block"></div>
          <div class="w-8 h-8 bg-[#3E3E3E] rounded-lg inline-block"></div>
        </div>

        <!-- Title skeleton -->
        <div class="h-6 w-48 bg-[#3E3E3E] rounded pr-10"></div>

        <!-- Country skeleton -->
        <div class="h-4 w-24 bg-[#3E3E3E] rounded mt-1"></div>

        <!-- Metadata skeleton -->
        <div class="flex flex-wrap justify-between w-full items-center gap-x-6 gap-y-2 mt-3">
          <div class="h-3 w-40 bg-[#3E3E3E] rounded"></div>
          <div class="h-3 w-40 bg-[#3E3E3E] rounded"></div>
        </div>
      </div>

      <!-- Table placeholder -->
      <div class="px-5 py-5 sm:px-6">
        <div class="h-32 bg-[#3E3E3E] rounded-lg"></div>
      </div>
    </div>
  } @else if (error()) {
    <div class="flex justify-center items-center h-64">
      <div class="text-red-400">{{ error() }}</div>
    </div>
  } @else if (!entity()) {
    <div class="flex justify-center items-center h-64">
      <div class="text-gray-400">Entity not found.</div>
    </div>
  } @else {
    <!-- Use @let to capture the non-null entity -->
    @let ent = entity()!;
    <div class="rounded-xl border border-[#3E3E3E] shadow-sm overflow-hidden relative">
      <div class="relative p-6 border border-white/10 rounded-lg">
        <div class="absolute top-3 right-3 p-2 space-x-2">
          <button
            (click)="openEditDialog(ent)"
            class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
            aria-label="Edit"
          >
            <span class="material-symbols-outlined text-xl">edit</span>
          </button>
          <button
            (click)="deleteEntity(ent)"
            class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
            aria-label="Delete"
          >
            <span class="material-symbols-outlined text-xl">delete</span>
          </button>
        </div>

        <h2 class="font-bold text-white headline-small !text-xl pr-10 flex items-center gap-2">
          {{ ent.name }}
        </h2>
        <span>{{ ent.country }}</span>

        <div class="flex flex-wrap justify-between w-full items-center gap-x-6 gap-y-2 !text-sm text-[#8b95b0] label-large mt-3">
          <span>
            <span class="text-[#b0b8cc]">Created:</span>
            {{ ent.createdAt | date:'MMM d, y, h:mm a' }}
          </span>
          <span>
            <span class="text-[#b0b8cc]">Updated:</span>
            {{ ent.updatedAt | date:'MMM d, y, h:mm a' }}
          </span>
        </div>
      </div>

      <div class="px-5 py-5 sm:px-6">
        <app-organization-table [entityId]="ent.id" />
      </div>
    </div>
  }
</div>
