<div class="min-h-screen flex-col space-y-3">
  <app-custom-breadcrumbs />

  <div *ngIf="!(organization$ | async)" class="flex justify-center items-center h-64">
    <div class="text-gray-400">Loading organization…</div>
  </div>

  <ng-container *ngIf="organization$ | async as organization">
    <div *ngIf="!organization" class="flex justify-center items-center h-64">
      <div class="text-gray-400">organization not found.</div>
    </div>

    <div *ngIf="organization" class="rounded-xl border border-[#3E3E3E] shadow-sm overflow-hidden relative">
      <div class="px-5 py-4 border-b border-[#3E3E3E] sm:px-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
          <div>
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 bg-[#2a2a2a] flex items-center justify-center">
                <ng-container *ngIf="organization.crestUrl; else initials">
                  <img
                    [src]="organization.crestUrl"
                    alt="{{ organization.name }}"
                    class="w-full h-full object-cover"
                    (error)="onImageError(organization)"
                  />
                </ng-container>
                <ng-template #initials>
                  <span class="text-lg font-medium text-white/80">
                    {{ organization.name.charAt(0).toUpperCase() }}
                  </span>
                </ng-template>
              </div>
              <h1 class="text-xl font-bold text-white self-center">{{ organization.name }}</h1>
            </div>
            <div class="flex flex-wrap items-center gap-3 mt-1 text-xs text-gray-400">
              <span>
                <span class="font-medium text-gray-300">Created:</span>
                {{ organization.createdAt | date:'medium' }}
              </span>
              <span class="w-px h-3 bg-[#3E3E3E]"></span>
              <span>
                <span class="font-medium text-gray-300">Updated:</span>
                {{ organization.updatedAt | date:'medium' }}
              </span>
              <span class="w-px h-3 bg-[#3E3E3E]"></span>
            </div>
          </div>
        </div>
        <div class="absolute top-[1px] right-3 p-2 space-x-2">
          <button
            class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
            aria-label="Edit"
            (click)="openEditDialog(organization)"
          >
            <span class="material-symbols-outlined text-xl">edit</span>
          </button>
          <button
            class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
            aria-label="Delete"
            (click)="deleteOrganization(organization)"
          >
            <span class="material-symbols-outlined text-xl">delete</span>
          </button>
        </div>
      </div>

      <div class="px-5 py-5 sm:px-6">
        <app-participant-table/>
      </div>
    </div>
  </ng-container>
</div>
