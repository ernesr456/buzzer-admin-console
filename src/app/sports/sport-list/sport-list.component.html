<div class="text-white">
  <div class="md:flex justify-between items-center mb-6 space-y-3 md:space-y-0">
    <app-custom-breadcrumbs />
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="p-4 rounded-lg text-center border border-white/10">
      <p class="!text-[24px] font-light font-poppins">{{ totalSports() }}</p>
      <p class="uppercase text-[10px] tracking-wider text-white/60">Sports</p>
    </div>
    <div class="p-4 rounded-lg text-center border border-white/10">
      <p class="!text-[24px] font-light font-poppins">{{ totalEntities() }}</p>
      <p class="uppercase text-[10px] tracking-wider text-white/60">Main Entities</p>
    </div>
    <div class="p-4 rounded-lg text-center border border-white/10">
      <p class="!text-[24px] font-light font-poppins">{{ totalOrganisations() }}</p>
      <p class="uppercase text-[10px] tracking-wider text-white/60">Organizations</p>
    </div>
    <div class="p-4 rounded-lg text-center border border-white/10">
      <p class="!text-[24px] font-light font-poppins">{{ totalParticipants() }}</p>
      <p class="uppercase text-[10px] tracking-wider text-white/60">Participants</p>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
    <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-fit">
      <input #bulkImportInput type="file" accept=".json,.csv" class="hidden" (change)="handleBulkImport($event)" />
      <button
        type="button"
        (click)="bulkImportInput.click()"
        [disabled]="importLoading()"
        class="flex items-center border border-[#FFB414]/40 gap-2 px-4 py-2 font-medium font-[10px] rounded-md hover:bg-[#FFB414]/10 transition w-full sm:w-fit"
      >
        @if (!importLoading()) {
          <span class="material-symbols-outlined text-xl">upload_file</span>
        } @else {
          <span class="material-symbols-outlined text-xl animate-spin">autorenew</span>
        }
        <span>{{ importLoading() ? 'Importing...' : 'Bulk Import' }}</span>
      </button>
    </div>
  </div>

  <app-sport-table
    [sports]="sportsSignal()"
    [counts]="counts()"
    [loading]="loading()"
  />
</div>
