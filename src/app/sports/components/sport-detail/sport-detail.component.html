<div class="flex-col space-y-3">
  <app-custom-breadcrumbs/>

  <ng-container *ngIf="sport$ | async as sport">
    <div class="relative p-6 border border-white/10 rounded-lg">
      <div class="absolute top-3 right-3 p-2 space-x-2">
        <button
          (click)="openEditDialog(sport)"
          class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
          aria-label="Edit"
        >
          <span class="material-symbols-outlined text-xl">edit</span>
        </button>
        <button
          (click)="deleteSport(sport)"
          class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
          aria-label="Delete"
        >
          <span class="material-symbols-outlined text-xl">delete</span>
        </button>
      </div>

      <div class="flex flex-wrap justify-between w-full items-center gap-x-6 gap-y-2 !text-sm text-[#8b95b0] label-large mt-3">
        <div class="grid">
          <span>
            <span class="text-[#b0b8cc]">Created:</span>
            {{ sport.createdAt | date:'MMM d, y, a, \'at\' HH:mm' }}
          </span>
          <span>
            <span class="text-[#b0b8cc]">Updated:</span>
            {{ sport.updatedAt | date:'MMM d, y, a, \'at\' HH:mm' }}
          </span>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-3 space-x-3">
      <div class="py-4 px-6 text-center border border-white/10 rounded-lg">
        <div class="text-2xl text-white">{{ sport?.entities?.length ?? 0 }}</div>
        <div class="text-xs font-medium text-[#6b7a9a] uppercase tracking-wider">Main Entities</div>
      </div>
      <div class="py-4 px-6 text-center border border-white/10 rounded-lg">
        <div class="text-2xl text-white">{{ totalCompetitions$ | async }}</div>
        <div class="text-xs font-medium text-[#6b7a9a] uppercase tracking-wider">Competitions</div>
      </div>
      <div class="py-4 px-6 text-center border border-white/10 rounded-lg">
        <div class="text-2xl text-white">{{ totalParticipants$ | async }}</div>
        <div class="text-xs font-medium text-[#6b7a9a] uppercase tracking-wider">Participants</div>
      </div>
    </div>

    <app-entity-table/>
  </ng-container>
</div>
