<!-- participant-table.component.html -->
<div class="flex flex-wrap justify-between">
  <h2 class="text-xl self-center">Participants</h2>
  <button
    (click)="openAddDialog()"
    class="flex items-center border border-white/10 gap-2 px-4 py-2 font-medium rounded-md hover:opacity-90 transition w-full md:w-fit !font-[10px]"
  >
    <span class="material-symbols-outlined">Add</span>
    Add Participant
  </button>
</div>

<div class="overflow-x-auto">
  <table class="w-full text-sm [&_td:nth-child(even)]:bg-white/5 [&_th:nth-child(even)]:bg-white/5">
    <thead class="bg-white/10">
      <tr class="border-b border-white/5">
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Name</th>
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Logo</th>
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Actions</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngIf="participants.length > 0; else emptyState">
        <tr
          *ngFor="let participant of participants"
          class="border-b border-white/5 last:border-0 hover:bg-white/10 transition cursor-pointer"
          (click)="navigateToDetail(participant)"
        >
          <td class="py-3 px-4">
            <span class="text-white font-medium">{{ participant.name }}</span>
          </td>
          <td class="py-3 px-4">
            <span *ngIf="participant.logo; else noLogo" class="text-sm text-gray-400">
              {{ participant.logo }}
            </span>
            <ng-template #noLogo>
              <span class="text-sm text-gray-500">—</span>
            </ng-template>
          </td>
          <td class="py-3 px-4">
            <button
              (click)="$event.stopPropagation(); openEditDialog(participant)"
              class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
              aria-label="Edit"
            >
              <span class="material-symbols-outlined text-xl">edit</span>
            </button>
            <button
              (click)="$event.stopPropagation(); deleteParticipant(participant)"
              class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
              aria-label="Delete"
            >
              <span class="material-symbols-outlined text-xl">delete</span>
            </button>
          </td>
        </tr>
      </ng-container>
      <ng-template #emptyState>
        <tr>
          <td colspan="3" class="py-6 text-center text-[#8b95b0]">
            <span class="material-symbols-outlined text-2xl block mb-1">inbox</span>
            No participants found for this organization.
          </td>
        </tr>
      </ng-template>
    </tbody>
  </table>
</div>
