<!-- custom-breadcrumbs.component.html -->
<nav class="flex px-5 py-3 mb-4 text-gray-700 border border-gray-200 rounded-lg bg-gray-50" aria-label="Breadcrumb">
  <ol class="inline-flex items-center flex-wrap space-x-1 md:space-x-2 rtl:space-x-reverse">
    <li
      *ngFor="let crumb of breadcrumbs; let last = last"
      class="inline-flex items-center"
    >
      <!-- Link (not last) -->
      <a
        *ngIf="!last"
        [routerLink]="crumb.url"
        class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600 transition-colors duration-200"
      >
        {{ crumb.label }}
      </a>

      <span
        *ngIf="last"
        class="text-sm font-semibold text-gray-900"
        aria-current="page"
      >
        {{ crumb.label }}
      </span>

      <span
        *ngIf="!last"
        class="mx-1 text-gray-400 md:mx-2"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </span>
    </li>
  </ol>
</nav>
