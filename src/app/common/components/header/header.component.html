<header
  class="relative flex items-center justify-between h-[72px] header-bg border-b border-theme sticky top-0 z-20 md:px-6 md:py-3 px-3 py-2"
  [ngClass]="sidebarService.collapsed() ? 'md:ml-20' : 'md:ml-[260px]'"
>
  <div class="flex items-center flex-shrink-0 md:hidden">
    <!-- Mobile menu button -->
    <button
      class="md:hidden mr-3 text-white/70 hover:text-white"
      (click)="sidebarService.toggleMobile()"
      aria-label="Open menu"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
  </div>

  <!-- Centered mobile / desktop title -->
  <div class="absolute md:static left-1/2 md:-translate-x-0 -translate-x-1/2 flex justify-center md:justify-start">
    <span class="headline-small text-white">{{ pageTitle() }}</span>
  </div>

  <!-- Search / actions -->
  <div class="flex items-center gap-3">
    <!-- Mobile search icon -->
    <button
      class="md:hidden text-white/80 hover:text-white"
      (click)="openMobileSearch()"
      aria-label="Open search"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </button>

    <!-- Desktop search input -->
    <div class="hidden md:block flex-1 max-w-[480px]">
      <div class="relative flex items-center w-full">
        <!-- <img
          src="assets/icons/Icons=ic_search.svg"
          alt=""
          aria-hidden="true"
          class="absolute left-3 w-[18px] h-[18px] opacity-40 pointer-events-none"
        /> -->
        <span class="material-symbols-outlined text-xl absolute left-3 -translate-y-1/2 w-4 h-4 opacity-60">Search</span>
        <input
          class="w-full md:min-w-[361px] h-10 p-[12px] !pl-10 rounded-lg title-large h-fit border border-white/10 bg-white/5 text-white body-small placeholder:text-white/40 outline-none focus:border-yellow focus:bg-transparent transition-colors"
          type="text"
          placeholder="Search"
        />
      </div>
    </div>

    <!-- Theme switch (desktop and tablet) -->
    <!-- <div class="hidden md:flex items-center">
      <button
        (click)="toggleTheme()"
        role="switch"
        [attr.aria-checked]="isDark()"
        class="flex items-center w-12 h-7 rounded-full p-1 transition-colors"
        [ngClass]="{ 'bg-yellow': isDark(), 'bg-gray-600': !isDark() }"
        aria-label="Toggle theme"
      >
        <span
          class="bg-white w-5 h-5 rounded-full shadow transition-transform"
          [ngStyle]="{ 'transform': isDark() ? 'translateX(100%)' : 'translateX(0)' }"
        ></span>
      </button>
    </div> -->

    <!-- small theme switch icon for mobile (next to search icon) -->
    <button class="md:hidden text-white/80 hover:text-white" (click)="toggleTheme()" aria-label="Toggle theme">
      <svg *ngIf="!isDark()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white">
        <circle cx="12" cy="12" r="5"></circle>
      </svg>
      <svg *ngIf="isDark()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
      </svg>
    </button>
  </div>

  <!-- Mobile top search bar -->
  <div *ngIf="mobileSearchOpen()" class="md:hidden absolute left-0 right-0 top-0 z-50">
    <div class="shadow-sm">
      <div class="flex items-center gap-3 px-3 py-2 h-[70px] header-bg rounded-lg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          autofocus
          class="flex-1 bg-transparent !text-white outline-none placeholder:text-gray-400 px-1"
          type="text"
          placeholder="Search Anything Here..."
        />
        <button class="text-white hover:text-white/50" (click)="closeMobileSearch()" aria-label="Close search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>
