<div class="flex flex-col items-center justify-between gap-4 mb-4">
  <h1 class="text-2xl self-start">Squad Members</h1>
  <div class="flex gap-3 flex-wrap items-center w-full">
    <div class="flex items-center gap-2 flex-1 min-w-[200px]">
      <span class="material-symbols-outlined text-white/50">search</span>
      <input
        type="text"
        placeholder="Search by name or position..."
        (input)="onSearch($any($event.target).value)"
        class="w-full bg-[#131515] border border-white/10 rounded-md px-3 py-2 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-[#FFB414]"
      />
    </div>
    <button
      (click)="openAddDialog()"
      class="flex items-center border border-white/10 gap-2 px-4 py-2 font-medium rounded-md hover:opacity-90 transition w-full md:w-fit"
    >
      <span class="material-symbols-outlined">add</span>
      Add Squad Member
    </button>
  </div>
</div>

<div class="overflow-x-auto">
  <table class="w-full text-sm [&_td:nth-child(even)]:bg-white/5 [&_th:nth-child(even)]:bg-white/5">
    <thead class="bg-white/10">
      <tr class="border-b border-white/5">
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Name</th>
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Position</th>
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Age</th>
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Agreement End</th>
        <th class="text-left py-3 px-4 font-semibold text-white/60 uppercase text-xs tracking-wider">Actions</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngIf="isLoading; else content">
        <tr *ngFor="let _ of [1,2,3]">
          <td colspan="5" class="py-3 px-4">
            <div class="skeleton-line w-3/4 h-4"></div>
          </td>
        </tr>
      </ng-container>

      <ng-template #content>
        <ng-container *ngIf="tableRows.length > 0; else emptyState">
          <tr
            *ngFor="let row of tableRows"
            class="border-b border-white/5 last:border-0 hover:bg-white/10 transition"
          >
            <td class="py-3 px-4 flex items-center gap-3">
                <img
                  [src]="row.photoUrl || getDefaultAvatar()"
                  alt="{{ row.displayName }} photo"
                  class="w-8 h-8 rounded-full object-cover bg-white/5"
                  (error)="row.photoUrl = getDefaultAvatar()"
                />
              <span class="text-white font-medium">{{ row.displayName }}</span>
            </td>
            <td class="py-3 px-4">{{ row.position }}</td>
            <td class="py-3 px-4">{{ row.age }}</td>
            <td class="py-3 px-4">{{ row.agreementEnd | date:'mediumDate' }}</td>
            <td class="py-3 px-4">
              <button
                (click)="$event.stopPropagation(); openEditDialog(row.squad)"
                class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
                aria-label="Edit"
              >
                <span class="material-symbols-outlined text-xl">edit</span>
              </button>
              <button
                (click)="$event.stopPropagation(); deleteSquad(row.squad)"
                class="rounded-lg hover:bg-[#1e2740] transition text-[#8b95b0] hover:text-white z-10 p-1"
                aria-label="Delete"
              >
                <span class="material-symbols-outlined text-xl">delete</span>
              </button>
            </td>
          </tr>
        </ng-container>
        <ng-template #emptyState>
          <tr>
            <td colspan="5" class="py-6 text-center text-[#8b95b0]">
              <span class="material-symbols-outlined text-2xl block mb-1">inbox</span>
              No squad members found for this organization.
            </td>
          </tr>
        </ng-template>
      </ng-template>
    </tbody>
  </table>
</div>
